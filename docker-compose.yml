services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-resume_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-resume_pass}
      POSTGRES_DB: ${PGDATABASE:-resume_builder}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - resume_builder_pgdata:/var/lib/postgresql/data

volumes:
  resume_builder_pgdata:
